# LOOP 全量页面清单（Screen Inventory）

> 版本 v1.4 · 2026-08-23 · 基线：现有原型 11 屏 + 群内语音房模块
>
> **已拍板前置决策：**
> 1. 交易形态：**路线 C（多链现货 + Hyperliquid 永续双形态）**
> 2. 开发语言：**Flutter**
> 3. 原型路径：**两步走 —— HTML 定稿 → 再翻 Flutter**
> 4. 本次 HTML 定稿范围：**只画 A 档**（B/C 档只列清单不画）
> 5. Perp 入口：**Market 内分「现货 / 合约」两栏**，不加 Tab，6 Tab 不变
> 6. Chat 形态：**不做 Server/频道/角色权限**，保持会话列表 + 群聊 + 群内语音房
> 7. Perp 范围：**只做 Hyperliquid 核心白名单市场，不做 HIP-3 自建市场**
> 8. 安全层：**去掉「AI」包装，保留钱包基础安全能力**（详见下方第六节）
> 9. 实现策略：**集成优先**。每个模块先审计官方/成熟供应商能力；能由 SDK、API 或托管流程覆盖的只做薄适配层，LOOP 只自研差异化体验、编排与策略。确认存在供应商缺口后，任何自建基础设施都要单独说明成本/风险并再次批准

这份清单是测试用例、开发进度表、外包工作量估算的**共同地基**。任何一屏的增删都要回到这里改，不要在别的文档里另起一份。

**优先级三档**（决定这次画多少、外包先做哪些）：

| 档 | 含义 | 这次是否画 HTML |
|---|---|---|
| **A** | 砍掉闭环就断，或首次使用必经 | ✅ 必画 |

## 三、路由结构

底部 6 Tab 不变（决策 5）：

```text
Tab 层    home │ market │ launchpad │ chat │ wallet │ profile
                   │
          ┌────────┴────────┐
       现货分栏          合约分栏 ← Perp 12 屏挂在这里
```

当前原型的 `ROUTES` 已是集中式多级数据表，Task 1 固定的 canonical stacks 为：`#send` = `wallet → send`、`#send-to` = `wallet → send → send-to`、`#send-confirm` = `wallet → send → send-to → send-confirm`、`#tx-result` = `wallet → tx-result`。F11 是覆盖在当前来源栈上的唯一共享弹层，F5 进入 F11 时仍保留完整 `wallet → send → send-to → send-confirm` 来源；F12 是独立结果入口而不是 F5 的可伪造尾节点。四个新路由目前仍是不可用结构壳，F3–F5/F12 功能待实现。

**路由不变量（沿用已拍板的工程纪律）**：hash / history / 内存栈由一处派生；App 内返回沿层级上一级，浏览器返回按真实路径回溯；非活动页 `inert` + `aria-hidden`。

**原则：保留能力，去掉叙事。** 不再说"AI 安全层"、不显示"AI 风险分 72/100"、不做 AI Guard 品牌包装，但钱包该有的安全义务一项不少——这些是 Rabby / MetaMask / Phantom 都有的基本功能，删掉会形成用户可感知的安全缺陷。

| 无限授权拦截 | "AI Guard 拦截" | "This app is asking for unlimited access" + 限额建议 | F16 |
| 交易前模拟 | "AI 预检通过" | "Simulated — you will receive ≈ X" | F11、F7 |

数据源仍用 GoPlus（$199~799/月）+ 交易模拟。差别只在**呈现方式**：不给分数、不给品牌，只陈述具体事实，让用户自己判断。

## 二、修正：Hyperliquid 需要申请 builder code

**交易本身不需要注册账号，这点开发说得对。** 但有两件事要补：

### 2.1 builder code 必须申请（这是 perp 侧唯一收入来源）

不申请 builder code，第三方前端**无法对订单抽成**，等于白送流量。

行业教训（调研数据）：
- Hyperliquid builder 累计分成 $64M，但极度集中于 Phantom（$12.6M+）
- MetaMask 收满 0.1% builder fee 仍被描述为"悄然亏损"

**建议**：立刻申请，并在合同里明确抽成费率归属方。

### 2.2 agent wallet 的权限边界必须显式约束

开发说「用户 Master Wallet 和 Agent Wallet 由 Privy 运行时创建」——架构对，但要补一条硬约束：

> **Agent Wallet 必须配置为「只能交易、不能提现」。**

理由：agent wallet 私钥在后端。这条约束是后端被攻破时的唯一防线——最坏情况变成"乱下单"而不是"资产被卷走"。

**验收要求**：在 Privy Policy 里显式配置，并在第 1 周的 Go/No-Go 3 里实测验证（尝试用 agent wallet 发起提现，必须失败）。

| Flutter SDK 质量 | ✅ **全场最好**（月下载 4.16 万，264 个版本，`attachmentBuilders` 自定义渲染是一等公民） | ✅ 官方 SDK + TUIKit 现成 UI |
| 20 万人单群 | ⚠️ 未经证实 | ✅ 默认 10 万，工单可扩 100 万，带历史漫游 |
| 自定义 Token 卡片消息 | ✅ 支持 | ✅ customElem 任意 JSON |
| 自定义匿名身份 | ✅ JWT | ✅ UserSig 自签发 |
| 语音房 | ✅ Stream Video，$0.30/千参与者分钟 | ✅ TRTC |
| 1 万 DAU | $2,000~2,800/月 | $1,000~2,600/月 |
| 10 万 DAU | $4,000~9,000/月（议价） | $2,300~4,300/月 |
| 中国团队开发体验 | ⚠️ 无国内节点，有延迟 | ✅ 无障碍 |

### 3.3 我的建议：可以选 Stream

理由：

1. **20 万人群不是 Day-1 需求**，上线时不会有这个量级
2. **SDK 文档质量直接影响 AI 生成代码的正确率** —— 在"AI 写代码 + 人工审核"的模式下，这是实打实的收益，不是虚的
3. 单厂商（Chat + Video 一家）少一套鉴权和状态同步的胶水代码
4. 成本溢价约 2 倍，但绝对值在 10 万 DAU 时是每月多 $1,700~4,700，可接受

**风险与对策**：换 IM 供应商的主要代价是历史消息迁移，且随时间增长。所以 3.1 的问题必须**现在**问，不要等到有了 10 万条历史消息再发现群上限不够。

### 3.4 如果选 Stream，注意一个 API 稳定性问题

Stream 的自定义消息渲染 API 在 v7→v10 之间改过两次（`customAttachmentBuilders` 废弃 → `attachmentBuilders` → v10 的 `StreamComponentFactory`）。

Token 卡片消息是产品核心功能，**要向 Stream 确认 v10 的 API 是否稳定**，否则每次大版本升级都要重写这一层。

开发选 Privy 正确——调研确认它有**官方 Flutter SDK**（`privy_flutter` v0.10.1，支持 EIP-712 + Solana），是唯一同时覆盖「嵌入式钱包 + 策略引擎 + Agent 签名 + 官方 Hyperliquid recipe」四件事的供应商。

### 1.2 自建后端基础设施（架构已定：交易签名下沉后端）

## 四点五、开工第一周的三个 Go/No-Go 技术验证

这是 Flutter 可行性调研给出的硬性要求：**这三条任何一条不通，架构就要调整。在验证通过之前不要开始写业务 UI。**

| # | 验证项 | 为什么是卡口 |
|---|---|---|
| 1 | **iOS 工程共存** —— `privy_flutter`（要求 Swift Package Manager）+ 语音 SDK + `flutter_inappwebview` 在同一 iOS 工程编译通过并跑通 | Privy 强制走 SPM，而 SPM 与传统 CocoaPods 插件混用在部分插件上仍有兼容问题，CI 脚本也要改。**这是最可能推翻工期估算的隐蔽风险** |
| 2 | **Privy 能否签 Hyperliquid 的非常规域** —— 用 `ethSignTypedDataV4` 签 `chainId: 1337` / `name: "Exchange"` 的 typed data，并在 Hyperliquid testnet 校验通过 | Privy 可能因 chainId 不在已配置链列表而拒签。这是**全部架构建议的前提**，不通则 perp 路线要重做 |
| 3 | **agent wallet 全链路** —— App 内 Privy 签 `approveAgent` → 后端 agent wallet 用官方 Python SDK 在 testnet 成功下单 | 验证"签名下沉后端"这套安全模型真的能跑通 |

**建议把这三条写进合同的第一个里程碑，验证报告作为交付物。** 这比先出 UI 更能降低项目风险。

## 六、必须让项目方知道的三个风险

### 1. 永续合约在 iOS 上有结构性障碍

Apple 审核指南 3.1.5(iv) 要求：加密期货类 App 必须由**持牌银行/证券公司/FCM 提交**。LOOP 主体不是，属结构性不合格。

**旁证**：Hyperliquid 官方 App 在 2026-04 只发了 Android 版，iOS 至今未上——连协议方自己都过不了。

**这意味着**：iOS 版可能无法提供永续合约下单功能。需要项目方拍板：接受（iOS 只做现货）还是寻找持牌实体合作。

### 2. 上架策略建议双轨制

商店上传"合规瘦身版"（行情 + 非托管钱包 + 聊天 + 只读 Launchpad），完整功能走 PWA。

**关键护城河**：Google Play 2026-01-28 生效的新政策中，**非托管钱包明确豁免**。坚持非托管是最大的合规优势，不要动摇。

高风险点：Launchpad（Apple 3.1.5 禁 ICO/类证券发行，Google Play 禁盲盒抽奖与"赚钱"叙事）、App 内 Swap（3.1.5(ii) 是高频拒审点）、挖矿激励（"赚钱"叙事）。

### 3. 钱包供应商锁定会连带锁死社交身份

更换嵌入式钱包供应商必然更换用户地址。而 LOOP 把社交身份建在地址上，换供应商 = 社交图谱断裂，比普通 App 严重得多。

**对策（必须在写第一行身份代码前定下）**：身份系统用**内部 user id 做主键**，钱包地址作为可挂载凭证。这样换供应商时社交关系不丢。

IM 侧有一条同源的硬约束：**IM 的 UserID 必须用与钱包无关的随机内部 ID**。如果直接拿钱包地址当 IM UserID，匿名承诺当场失效——任何人都能从聊天身份反查出地址和全部持仓。

## 附：两条影响页面设计的技术约束

这两条来自 IM 选型调研，会改变 UI 实现方式，写在这里以免开发时踩坑：

**1. Token 卡片消息只存标识字段，价格在渲染时才拉**

聊天消息是永久存储的。如果把价格、涨跌、流动性一起写进消息 payload，三个月后翻历史消息会看到过期价格——用户可能据此做交易决策。

正确做法：消息里只存 `{chain, contract_address, ticker}`，客户端渲染时实时调行情 API 补齐价格与风险分。这也意味着 Token 卡片需要有「加载中」和「数据拉取失败」两个状态（已列入页面清单 E5 的关键状态）。

**2. 大群不做端到端加密**

三家主力 IM 均不支持大群 E2EE，20 万人群做 E2EE 在密码学上也不现实（密钥分发与成员变更的开销随成员数爆炸）。

建议：**E2EE 只在 1:1 私聊考虑**。现原型群聊页顶部写的「end-to-end encrypted」提示需要修正，否则是虚假承诺。

## 一、这个计划成立的条件与不成立的地方

先说结论，避免看完 6 周排期才发现前提有问题。

### 30 天能装下的量

审核是唯一不可压缩的串行资源。每天 3.5 小时 × 30 天 = **105 小时审核预算**。这决定了整个计划的吞吐上限，不是 AI 的生成速度。

按代码类型分配这 105 小时：

| 代码类型 | 预估行数 | 审核方式 | 小时/千行 | 小计 |
|---|---:|---|---:|---:|
| UI 层（47 屏布局与样式） | ~17,500 | 看截图 + 扫代码结构 | 1.2 | 21 h |
| 业务逻辑 / 状态管理 / 列表分页 | ~7,500 | 读关键路径 + 看测试结果 | 2.5 | 19 h |
| **资金相关**（签名、精度、强平价、授权、agent wallet） | ~6,500 | **逐行读 + 自己算一遍 + testnet 实测** | **6.0** | **39 h** |
| 后端 API / 数据聚合 | ~3,000 | 读接口契约 + 看集成测试 | 2.0 | 6 h |
| 配置 / CI / 脚手架 | ~2,000 | 抽查 | 0.8 | 2 h |
| **合计** | **~35,500** | | | **85 h** |

**85 小时 < 105 小时预算，剩 20 小时缓冲（19%）。**

三次决策对缓冲的累计影响：

| 决策 | 变化 | 缓冲 |
|---|---|---|
| 初版（A 档 48 屏，全自建聚合器） | — | 11% |
| 决策 7、8（perp 只做核心市场 + 去 AI 包装，删 2 屏） | −3 h | 14% |
| **决策 9（Swap/跨链走 Privy 内置）** | **−5 h**（少约 1,500 行聚合器封装与路由 UI） | **19%** |

**资金相关的 39 小时始终没减。** 这是刻意的——三次削减都只动了"能买到就不自己写"的部分，签名、精度、强平价、授权拦截这些必须逐行审的代码一行没省。19% 的缓冲现在能吃下一次 Go/No-Go 失败的返工。

缓冲会被三件事吃掉：返工、Go/No-Go 验证失败后的架构调整、iOS 音频会话与 SPM 兼容这类"不可预估的坑"。

### 明确不成立的三件事

| # | 事项 | 为什么 |
|---|---|---|
| 1 | **不含安全审计** | 钱包类产品的第三方安全审计周期是 2~4 周且独立报价，不可能塞进这 30 天。内测版不涉真实资金可以延后，**但正式上线前必须做** |
| 2 | **不含上架审核** | Apple 重审金融类 App 常需 1~3 周，且可能反复。这次交内测版正好绕开，但要知道这是**推迟不是消除** |
| 3 | **iOS 上没有 perp 下单** | Apple 3.1.5(iv) 要求加密期货 App 由持牌机构提交。内测阶段 TestFlight 可以放，**但正式上架时 iOS 必须去掉 perp**。这不是工期问题，是结构性限制 |

### 一个必须接受的风险

**第 1 周的三个 Go/No-Go 验证如果失败，30 天不成立。**

其中最危险的是「Privy 能否签 Hyperliquid 的 chainId 1337 域」——它是整个 perp 架构的前提。如果 Privy 拒签，方案要改成"用户在 App 内额外生成一个独立 EOA 专用于 Hyperliquid"，这会新增约 8~12 人日，且要重新设计密钥保管方式。

**因此第 1 周排的是验证不是开发。这一周不产出业务 UI 是刻意的。**

## 二、审核纪律（这是计划能跑的关键，不是形式）

AI 写代码的失败模式和人不一样。人是"没想到"，AI 是"看起来对但细节错"。所以审核重点要相应调整。

### 分级审核规则

| 级别 | 适用范围 | 审核动作 | 不允许省略的 |
|---|---|---|---|
| **R0 逐行审** | 签名构造、私钥处理、agent wallet 授权、金额精度换算、强平价与保证金计算、授权额度改写 | 逐行读 + **自己独立算一遍数值** + testnet 实测 + 边界值手测 | 数值必须自己复算，不能只看 AI 说"已验证" |
| **R1 关键路径审** | 交易流程编排、状态机、错误处理、路由、缓存失效 | 读主路径与错误分支 + 跑自动化测试 | 错误分支必须读，AI 最爱漏这里 |
| **R2 截图审** | 47 屏 UI 布局、样式、动效、空/加载/错误态 | 看截图对比设计稿 + 扫代码找硬编码 | 移动端适配必须真机看，模拟器会骗人 |
| **R3 抽查** | 配置、CI、工具脚本、国际化文案 | 抽 20% | — |

### 每天的固定节奏（3.5 小时怎么花）

```
0:00–0:30   看昨天夜里 AI 的产出清单 + 自动化测试报告，决定今天审什么
0:30–2:00   R0/R1 深度审（每天必须留够 1.5 小时给资金相关代码）
2:00–3:00   R2 截图审 + 真机点一遍当天新增页面
3:00–3:30   写审核意见、标记返工项、给 AI 下一批任务
```

**硬规则：R0 类代码未通过审核，依赖它的下游任务不许开工。** 宁可让 AI 空转去做 UI，也不要在未验证的签名逻辑上叠功能——那样返工是成倍的。

### 三条必须自动化的检查（省人工审核时间）

这三样投入约 3 人日建设，能省下十几小时人工审核，值得在第 1 周做：

1. **金额精度属性测试** —— 随机生成大量金额做 wei/decimal 往返转换，断言无精度丢失。这类 bug 人眼极难看出
2. **47 屏截图回归** —— 每次构建自动截 47 屏，与基线比对，只把变化的屏推给人看。**这是 21 小时 UI 审核能压下来的主要原因**
3. **签名向量测试** —— 把 Hyperliquid 官方 Python SDK 的签名结果作为标准答案固化成测试向量，后端每次改动自动比对

- **R0 逐行**：F4 地址风险校验与 F5 gas 估算。首次转账提醒、高风险地址拦截不能只是 UI 摆设
- **R0**：Bridge 进度追踪的**失败与需手动 claim 分支**——跨链卡住是真实高频场景，用户会以为钱丢了
- **R1**：Swap 报价过期刷新逻辑、滑点保护
- **R1**：**Privy 内置 swap 的错误码覆盖** ——用第三方 SDK 的代价是错误分支不由自己定义，要把 Privy 返回的失败态全部映射到用户能看懂的提示，不能只处理 happy path
- **R2**：K 线在真机上的手势（缩放/拖拽/切周期）不能和页面滚动冲突

**出口标准**
- ✅ 闭环跑通：Market 发现 → Token 详情看风险 → Swap 买入 → Wallet 看到持仓
- ✅ 精度属性测试全绿
- ✅ 跨链在 testnet 完成一次，且中途杀 App 重开能看到正确进度

## 四、风险与缓冲消耗预案

19% 的缓冲（约 20 小时）比初版宽裕，但仍可能被吃掉——尤其是第 1 周 Go/No-Go 失败或第 4 周音频会话超预期。按优先级给出削减顺序——**真到了要削的时候，按这个顺序削，不要临时拍脑袋**：

| 顺序 | 削减项 | 影响 | 为什么可以先削 |
|---:|---|---|---|
| 1 | B4 全局搜索、E12 消息搜索 | 少两个入口 | 不在闭环上，用户可用列表页替代 |
| 2 | C3 全屏 K 线（保留内嵌图表） | 看图体验降级 | 内嵌图表已够看趋势 |
| 3 | D7/D10/D11（成交历史/出入金/资金费率详情） | perp 功能不完整 | 不阻塞下单闭环 |
| 4 | E10 语音房完整视图 | 只有内嵌卡片形态 | 内嵌卡片是已拍板的主形态 |
| 5 | H 组只留 H1 Profile | 设置项变少 | 内测版可接受 |
| **不许削** | **F11 签名弹层、F16 授权拦截、D3 下单确认、A6~A10 私钥五屏、I 组系统页** | — | 削这些等于交一个会让用户亏钱的内测版 |

### 三个需要提前准备的"可能爆炸点"

| 风险 | 概率 | 触发后的动作 |
|---|---|---|
| **Privy 拒签 chainId 1337** | 中 | 改用独立 EOA 专供 Hyperliquid，+8~12 人日。**第 1 周就会知道，不会拖到后面** |
| **iOS SPM 与原生插件冲突** | 中高 | 可能要锁插件版本或打补丁，+3~5 人日。同样第 1 周暴露 |

<script>
(function(){
var LABELS=["页面清单","账号清单（对齐开发）","账号清单（完整背景）","开发进度安排","测试用例"];
var content=document.getElementById('content'), toc=document.getElementById('toc');
var navLinks=[].slice.call(document.querySelectorAll('#docNav a'));
var sel=document.getElementById('docSelect');
LABELS.forEach(function(l,i){var o=document.createElement('option');o.value=i;o.textContent=l;sel.appendChild(o)});

function render(i){
  var src=document.getElementById('md'+i).textContent;
  function showRaw(){
    var pre=document.createElement('pre');pre.textContent=src;
    content.replaceChildren(pre);toc.replaceChildren();
  }
  try{
    if(!globalThis.marked || typeof globalThis.marked.setOptions!=='function' ||
       typeof globalThis.marked.parse!=='function') throw new Error('Marked API unavailable');
    globalThis.marked.setOptions({gfm:true,breaks:false});
    var rendered=globalThis.marked.parse(src);
    if(typeof rendered!=='string') throw new Error('Marked parse did not return HTML');
    content.innerHTML=rendered;
  }catch(_error){
    showRaw();
  }
  content.querySelectorAll('table').forEach(function(t){
    var w=document.createElement('div');w.className='table-wrap';
    t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
  toc.innerHTML='';
  var hs=[].slice.call(content.querySelectorAll('h2,h3'));
  hs.forEach(function(h,n){
    h.id='s'+n;
    var a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;
    a.className='depth-'+h.tagName.slice(1);
    a.addEventListener('click',function(e){e.preventDefault();h.scrollIntoView({behavior:'smooth'})});
    toc.appendChild(a);
  });
  navLinks.forEach(function(a,n){a.classList.toggle('on',n===i)});
  sel.value=i;
  window.scrollTo(0,0);
}

navLinks.forEach(function(a,i){
  a.addEventListener('click',function(e){e.preventDefault();location.hash=i;render(i)});
});
sel.addEventListener('change',function(e){location.hash=e.target.value;render(+e.target.value)});
window.addEventListener('hashchange',function(){
  var i=parseInt(location.hash.slice(1),10);
  if(!isNaN(i)&&i>=0&&i<LABELS.length) render(i);
});
document.getElementById('printBtn').addEventListener('click',function(){window.print()});

var start=parseInt(location.hash.slice(1),10);
render(!isNaN(start)&&start>=0&&start<LABELS.length?start:0);
})();
